<style>
/* Layout: one narrow column on a faint cobalt grid. Masthead, group bar, tabs, then square hairline cards. */
:root{
  --bg:#f1ede3;--paper:#fbf9f4;--ink:#141a33;--muted:#5d6175;--line:#d6d3c8;
  --accent:#1f45d6;--accent-ink:#ffffff;--accent-soft:#e3e8fb;
  --good:#1b7a4b;--good-soft:#e2efe6;--warn:#9c5600;--warn-soft:#f6e8d2;--bad:#c02a2a;--bad-soft:#f8e0de;
  --gridline:rgba(31,69,214,.07);
  --f-display:"Noto Serif Hebrew","Frank Ruhl Libre",Georgia,serif;
  --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1326;--paper:#161b33;--ink:#e8eaf4;--muted:#9aa0bb;--line:#2b3253;
  --accent:#7f97ff;--accent-ink:#0f1326;--accent-soft:#1f2850;
  --good:#6fd39a;--good-soft:#14301f;--warn:#f5b458;--warn-soft:#3a2810;--bad:#ff7a6c;--bad-soft:#3d1a16;
  --gridline:rgba(127,151,255,.07);color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body,.welcome{background-color:var(--bg);background-image:linear-gradient(to right,var(--gridline) 1px,transparent 1px),linear-gradient(to bottom,var(--gridline) 1px,transparent 1px);background-size:24px 24px}
body{color:var(--ink);font:17px/1.5 var(--f-body);margin:0;overflow-wrap:anywhere}
[hidden]{display:none!important}
main{max-width:680px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:2.7rem;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance}
.head{display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--accent);padding-top:12px}
.kicker{font-size:.78rem;font-weight:700;color:var(--accent)}
.titlebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:12px}
.titlebar h1{min-width:0}
.countdown{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border:1px solid var(--accent);background:var(--paper);text-align:start}
.cd-label{font-size:.72rem;font-weight:700;color:var(--accent)}
.cd-time{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.cd-time .clk{direction:ltr;unicode-bidi:isolate}
.cd-time small{font-size:.72rem;font-weight:700;color:var(--muted);margin-inline:1px 4px}
.countdown.live .cd-time{color:var(--bad)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.92rem;color:var(--muted)}
.status a{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;font-weight:700;font-size:.85rem;background:var(--accent);color:var(--accent-ink)}
.chip.lock{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--good-soft);color:var(--good)}
details{background:var(--paper);border:1px solid var(--line);padding:10px 14px}
summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
details ul{margin:8px 0 2px;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px}
details p{margin:8px 0 2px;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));background:var(--paper);border:1px solid var(--ink)}
nav button{border:0;border-inline-start:1px solid var(--line);background:transparent;padding:11px 4px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background-color .2s ease,color .2s ease}
nav button:first-child{border-inline-start:0}
nav button.on{background:var(--ink);color:var(--paper);font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--paper);padding:10px 16px;font-weight:700;text-decoration:none;color:var(--ink);transition:transform .1s ease,background-color .2s ease}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled),.step button:active:not(:disabled){transform:scale(.95)}
.card{background:var(--paper);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:4px;counter-reset:sec}
/* Section heads are numbered 01, 02, 03 within each card */
.sec{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.2;margin-top:20px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.sec::before{counter-increment:sec;content:counter(sec,decimal-leading-zero);font-family:var(--f-body);font-weight:800;font-size:.8rem;letter-spacing:.04em;color:var(--accent);align-self:center}
.sec:first-child{margin-top:0}
.sec small{margin-right:auto;font-family:var(--f-body);font-weight:600;color:var(--muted);font-size:.85rem;direction:ltr;unicode-bidi:isolate}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);min-height:46px}
.row:last-child{border-bottom:0}
.row .n{flex:1;min-width:0}
.ok{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}
.step{display:flex;align-items:center;gap:4px;direction:ltr}
.step button{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);font-weight:500;line-height:1;transition:transform .1s ease}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=datetime-local],textarea{background:var(--bg);border:1px solid var(--line);border-radius:0;padding:7px 8px;width:100%;font-size:max(16px,1em)}
input[type=datetime-local]{min-width:0;min-height:42px;display:block}
input[type=number]{width:62px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:disabled,textarea:disabled{opacity:.7}
label{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
.banner{padding:10px 14px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--line)}
.banner.warn{background:var(--warn-soft)}.banner.good{background:var(--good-soft)}.banner.bad{background:var(--bad-soft)}
.maj{position:relative;flex:0 1 120px;height:6px;background:var(--line)}
.maj i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);transition:width .35s cubic-bezier(.2,.7,.2,1)}
.maj b{position:absolute;inset-block:-4px;inset-inline-start:50.83%;width:2px;background:var(--ink)}
.tag{font-size:.75rem;font-weight:800;color:var(--good);white-space:nowrap}
.tag:not(:empty){display:inline-block;animation:pop .3s ease-out}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.rank{width:30px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.pts{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:start;position:sticky;inset-inline-start:0;background:var(--paper)}
.secrow th{background:var(--bg);color:var(--muted);font-size:.8rem;text-align:start}
td.hit{color:var(--good);font-weight:800;background:var(--good-soft)}
td.near{color:var(--warn);font-weight:800;background:var(--warn-soft)}
.bar{flex:1;min-width:40px;height:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.2,.7,.2,1)}
.avg{font-weight:800;min-width:44px;text-align:end;font-variant-numeric:tabular-nums}.rng{min-width:52px;text-align:end;font-size:.85rem;font-variant-numeric:tabular-nums}
.confirm{margin-top:10px;padding:12px;border:1px solid var(--bad);background:var(--bad-soft)}
.login{align-items:flex-start;gap:10px}
.login p{margin:0}
.login .lf{width:100%}
.login .hint{margin-top:8px;font-size:.85rem}
.or{display:flex;align-items:center;gap:10px;width:100%;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.n,td,th{unicode-bidi:plaintext}
.asname{margin:0 0 4px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.asname > span:first-child{flex:1 1 200px}
.asname.rn{flex-direction:column;align-items:stretch;gap:6px}
.rn-line{display:flex;gap:8px;align-items:center}
.rn-line input{flex:1;min-width:0}
.mine-link{background:none;border:0;padding:2px 4px;margin:-2px -4px;font:inherit;font-weight:700;color:var(--accent);cursor:pointer;border-radius:6px;text-align:start}
.mine-link:hover .mine-tag,.mine-link:focus-visible .mine-tag{text-decoration:underline}
.mine-tag{font-weight:600;font-size:.85em}
.gbar{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);padding:10px 14px}
.gtop{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.gname{font-weight:800;flex:1 1 220px;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.gname select{font-weight:800;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:5px 8px;max-width:100%}
.gname small{font-weight:600;color:var(--muted);margin-inline-start:6px}
.btn.sm{padding:6px 12px;font-size:.9rem}
.gcount{background:none;border:0;padding:2px 4px;font:inherit;font-size:.85rem;font-weight:700;color:var(--accent)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mlist li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.mlist li:last-child{border-bottom:0}
.gpanel{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.gpanel .line{display:flex;gap:8px;align-items:center}
.gpanel input{flex:1;min-width:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}
.pn{display:flex;align-items:center;gap:8px;min-width:0;direction:rtl;unicode-bidi:isolate}
.pt{min-width:0}
/* A tiny ballot slip: the party's letters, like on the paper in the booth. */
.slip{flex:none;display:inline-grid;place-items:center;width:2.6em;height:1.75em;border:1px solid var(--accent);background:var(--paper);font-weight:800;font-size:.75rem;line-height:1;color:var(--accent);letter-spacing:.02em}

/* ---------- Motion: short and light; all of it is switched off for "reduce motion" below ---------- */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dot{from{transform:scale(0)}60%{transform:scale(1.25)}to{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
/* The page settles in on arrival; a tab switch slides the new content up */
main.enter>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.06s}main.enter>*:nth-child(3){animation-delay:.12s}
main.enter>*:nth-child(4){animation-delay:.18s}main.enter>*:nth-child(5){animation-delay:.24s}
#view.swap>*{animation:up .3s ease-out both}
#view.swap>*:nth-child(2){animation-delay:.05s}
#view.swap .lb .row{animation:up .35s ease-out both;animation-delay:calc(var(--i,0) * 45ms + .1s)}
input.bump{animation:bump .22s ease-out}
.pop{display:inline-block;animation:pop .35s ease-out}

/* ---------- Welcome screen: once per device. 120 seats fill in, the first 61 (a majority) in full cobalt. ---------- */
.welcome{position:fixed;inset:0;z-index:50;overflow:auto;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));transition:opacity .45s ease,transform .45s ease}
.welcome.out{opacity:0;transform:translateY(-28px);pointer-events:none}
.w-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.w-rule{height:4px;background:var(--accent);transform-origin:right;animation:draw .6s .1s cubic-bezier(.6,0,.2,1) both}
.w-kicker{font-size:.8rem;font-weight:700;color:var(--accent);animation:fade .4s .45s both}
.w-title{font-family:var(--f-display);font-weight:700;font-size:3.1rem;line-height:1.02;letter-spacing:-.01em;margin:0;color:var(--ink)}
.w-title span{display:inline-block;animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.w-title span:nth-child(1){animation-delay:.6s}.w-title span:nth-child(2){animation-delay:.75s}.w-title span:nth-child(3){animation-delay:.9s;color:var(--accent)}
.w-seats{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:8px;padding:12px;border:1px solid var(--line);background:var(--paper)}
.w-seats i{display:block;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--accent) 22%,transparent);animation:dot .4s calc(1.1s + var(--d)) cubic-bezier(.3,.7,.3,1) both}
.w-seats i.m{background:var(--accent)}
.w-cap{margin:0;font-size:.92rem;color:var(--muted);animation:fade .4s 2s both}
.w-cap b{color:var(--ink);font-weight:800}
.w-sub{margin:4px 0 0;font-size:1.05rem;line-height:1.5;color:var(--ink);animation:up .5s 2.15s both}
.w-go{align-self:flex-start;font-size:1.05rem;padding:12px 22px;animation:up .5s 2.35s both}
.welcome.skip *{animation-delay:0s!important;animation-duration:.01s!important}

/* Phones: bigger tap targets, bloc bar and stats numbers drop under the name */
@media (pointer:coarse){.step button{width:42px;height:42px}}
@media (max-width:480px){
  h1{font-size:2rem}
  .countdown{padding:5px 8px}
  .cd-time{font-size:1.1rem}
  nav{grid-template-columns:repeat(auto-fit,minmax(72px,1fr))}
  nav button{font-size:.85rem;padding:11px 2px}
  .card{padding:14px 12px}
  input[type=number]{width:56px}
  .brow,.srow{flex-wrap:wrap;row-gap:4px}
  .brow .maj{order:9;flex:1 1 100%}
  .srow .n{flex-basis:100%}
  td:first-child{white-space:normal;overflow-wrap:normal;min-width:88px;max-width:120px;box-shadow:inset -1px 0 0 var(--line)}
  .w-title{font-size:2.7rem}
}
/* The smallest phones (320px): a slimmer stepper leaves the party name room for whole words */
@media (max-width:359px){
  h1{font-size:1.75rem}
  .step button{width:36px;height:36px}
  input[type=number]{width:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<main>
  <div class="head">
    <div class="kicker">בחירות לכנסת ה־26 · יום שלישי 27.10.2026</div>
    <div class="titlebar">
      <h1 id="title">הימורי בחירות 2026</h1>
      <div class="countdown" id="countdown" role="timer" aria-live="off" title="סגירת הקלפיות ושידור המדגמים, יום שלישי 27.10 בשעה 22:00">
        <span class="cd-label">עד המדגמים</span>
        <span class="cd-time" id="cd-time">–</span>
      </div>
    </div>
    <div class="status" id="status"><span class="chip">טוען…</span></div>
  </div>
  <div id="groupbar" hidden></div>
  <details>
    <summary>איך סופרים נקודות</summary>
    <ul id="rules-list"></ul>
  </details>
  <nav id="nav"></nav>
  <div id="view"></div>
</main>
<script>
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
const BLOCS=["גוש השינוי","גוש נתניהו","מפלגות ערביות"];
// Ballot letters approved by the Central Elections Committee (27.9.2026).
const LETTERS={"הליכוד":"מחל","יחד (בנט ולפיד)":"רק","ישר!":"דרך","ישראל ביתנו":"ל","ש״ס":"שס","יהדות התורה":"ג","הציונות הדתית":"ט","עוצמה יהודית":"ב","הדמוקרטים":"אמת","רע״מ":"עם","הרשימה המשותפת":"ודם","המילואימניקים והכלכלית (הנדל וזליכה)":"די","עמך ישראל (וינטר)":"ך"};
const pname=p=>{const l=LETTERS[p];return `<span class="pn">${l?`<span class="slip" title="אותיות הפתק: ${esc(l)}">${esc(l)}</span>`:""}<span class="pt">${esc(p)}</span></span>`};
const state={data:null,err:null,gpanel:null,group:lsGet("wager_group"),joinMsg:"",tab:"predict",draft:null,dirty:false,confirmLock:false,lastLocked:null,login:{name:""}};
const qs=new URLSearchParams(location.search);
const loginError=qs.get("login_error");
// An invite link (?join=CODE) is kept until the visitor is signed in, then used once.
if(qs.get("join"))lsSet("wager_join",qs.get("join"));
if(loginError||qs.get("join"))history.replaceState(null,"","/");

const $=s=>document.querySelector(s);
// Restarts a one-shot CSS animation class (bump, pop, swap) on an element.
const replay=(el,cls)=>{if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
const fmtTime=ts=>{try{return new Date(ts).toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"})}catch(e){return""}};
const cleanName=s=>String(s||"").replace(/\s+/g," ").trim().slice(0,30);
const cfg=()=>state.data?.config||{parties:[],exact:5,near:2,blocExact:5,blocNear:2,turnPts:3,turnBonus:2};
const locked=()=>!!state.data?.lockedAt;

async function api(path,body){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),credentials:"same-origin"});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||"השמירה נכשלה. נסה שוב."),{status:r.status});
  return j;
}
let loading=false;
async function load(){
  if(loading)return;loading=true;
  try{

/* ---------- scoring ---------- */
function score(p,res,bestTurn){
  const c=cfg();let t=0;const per={},bl={};let turn="",closest=false;
  for(const party of c.parties){
    if(res[party]==null)continue;
    const d=Math.abs((+p.seats?.[party]||0)-res[party]);
    if(d===0){t+=+c.exact;per[party]="x"}else if(d===1){t+=+c.near;per[party]="n"}
  }
  for(const b of BLOCS){
    if(res.blocs?.[b]==null)continue;
    const d=Math.abs((+p.blocs?.[b]||0)-res.blocs[b]);
    if(d===0){t+=+c.blocExact;bl[b]="x"}else if(d===1){t+=+c.blocNear;bl[b]="n"}
  }
  if(res.turnout!=null&&p.turnout!=null){
    const d=Math.abs(p.turnout-res.turnout);
    if(d<=1+1e-9){t+=+c.turnPts;turn="x"}
    if(Math.abs(d-bestTurn)<1e-9){closest=true;t+=+c.turnBonus}
  }
  return{total:t,per,bl,turn,closest};
}
const bestTurn=(list,res)=>res?.turnout!=null&&list.length?Math.min(...list.map(p=>Math.abs(p.turnout-res.turnout))):Infinity;
function scored(){
  const res=state.data.results,list=state.data.picks||[];if(!res)return null;
  const best=bestTurn(list,res);
  const rows=list.map(p=>({...p,s:score(p,res,best)})).sort((a,b)=>b.s.total-a.s.total);
  let rank=0;rows.forEach((r,i)=>{if(i===0||r.s.total!==rows[i-1].s.total)rank=i+1;r.rank=rank});
  return rows;
}

  if($("#nm"))$("#nm").oninput=e=>{state.dirty=true;delete msg.dataset.sticky;d.name=e.target.value;upd()};
  $("#view").querySelectorAll("input[type=number]").forEach(i=>{
    const attr=i.hasAttribute("data-p")?"data-p":i.hasAttribute("data-b")?"data-b":"data-t";
    const key=i.getAttribute(attr);
    i.oninput=()=>{set(attr,key,i.value);upd()};
    i.onblur=()=>{i.value=val(attr,key)};
  });
  $("#view").querySelectorAll("[data-inc],[data-dec]").forEach(btn=>btn.onclick=()=>{
    const attr=btn.dataset.a,key=btn.dataset.inc??btn.dataset.dec,dir=btn.dataset.inc!=null?1:-1;
    const cur=attr==="data-t"&&d.turnout===""?(dir>0?69.9:0):val(attr,key);
    set(attr,key,(+cur||0)+dir*(attr==="data-t"?0.1:1));
    const inp=document.getElementById(`${attr}-${key}`);inp.value=val(attr,key);replay(inp,"bump");upd();
  });
  $("#f").onsubmit=async e=>{
    e.preventDefault();upd();if($("#save").disabled)return;
    $("#save").disabled=true;msg.dataset.sticky="1";msg.textContent="שומר…";
    try{
      await api("/api/pick",{name:cleanName(d.name),seats:d.seats,blocs:d.blocs,turnout:+d.turnout});
      state.dirty=false;msg.textContent="נשמר ✓";await load();
    }catch(err){
      msg.textContent=err.message;$("#save").disabled=false;
      if(err.status===423||err.status===401){state.dirty=false;load()}
    }
  };
  upd();
}

    if(!d.entrants.length){$("#view").innerHTML='<div class="card muted">עוד אף אחד לא הגיש ניחוש. היה הראשון.</div>';return}
    $("#view").innerHTML=`<div class="banner">הניחושים חסויים עד הנעילה. כאן רואים רק מי כבר הגיש.</div><div class="card">${d.entrants.map(e=>`<div class="row"><span class="n">${e.mine?mine(e.name):esc(e.name)}</span><span class="muted">${esc(fmtTime(e.updatedAt))}</span></div>`).join("")}</div>`;return;

function vStats(){
  if(noGroup()){$("#view").innerHTML=noGroup();return}
  if(!locked()){$("#view").innerHTML='<div class="banner">📊 הסטטיסטיקה תופיע אחרי שההימורים יינעלו.</div>';return}
  const list=state.data.picks||[],res=state.data.results,c=cfg();
  if(!list.length){$("#view").innerHTML='<div class="card muted">אין ניחושים.</div>';return}
  const stat=f=>{const v=list.map(p=>+f(p)||0);return{a:v.reduce((x,y)=>x+y,0)/v.length,lo:Math.min(...v),hi:Math.max(...v)}};
  const block=(items,max,actual)=>items.sort((x,y)=>y.s.a-x.s.a).map(it=>`<div class="row srow"><span class="n">${pname(it.k)}</span><div class="bar"><i style="width:${Math.min(100,it.s.a/max*100)}%"></i></div><span class="avg">${it.s.a.toFixed(1)}</span><span class="rng muted">${it.s.lo}–${it.s.hi}</span>${actual?`<span class="rng">${esc(actual(it.k))}</span>`:""}</div>`).join("");
  const ps=c.parties.map(k=>({k,s:stat(p=>p.seats?.[k])})),bs=BLOCS.map(k=>({k,s:stat(p=>p.blocs?.[k])})),tn=stat(p=>p.turnout);
  const pmax=Math.max(...ps.map(x=>x.s.a),1),bmax=Math.max(...bs.map(x=>x.s.a),1);
  $("#view").innerHTML=`<div class="card"><p class="muted" style="margin:0">לפי ${list.length} ניחושים. עמודות: ממוצע · הכי נמוך–הכי גבוה${res?" · בפועל":""}.</p>
  <div class="sec">מנדטים לכל מפלגה</div>${block(ps,pmax,res?k=>res[k]??"–":null)}
  <div class="sec">גודל הגושים</div>${block(bs,bmax,res?k=>res.blocs?.[k]??"–":null)}
  <div class="sec">אחוז הצבעה</div><div class="row"><span class="n">ממוצע הניחושים</span><span class="avg">${tn.a.toFixed(1)}%</span><span class="rng muted">${tn.lo}–${tn.hi}</span>${res?.turnout!=null?`<span class="rng">${esc(res.turnout)}%</span>`:""}</div></div>`;
}

function vPicks(){
  if(noGroup()){$("#view").innerHTML=noGroup();return}
  if(!locked()){$("#view").innerHTML='<div class="banner">🙈 הניחושים של כולם ייחשפו רק אחרי הנעילה, כדי שאף אחד לא יוכל להעתיק.</div>';return}
  const res=state.data.results,list=state.data.picks||[],c=cfg();
  if(!list.length){$("#view").innerHTML='<div class="card muted">אין ניחושים.</div>';return}
  const best=bestTurn(list,res);
  const sc=list.map(p=>res?score(p,res,best):{per:{},bl:{},turn:""});
  const cols=list.length+(res?2:1),cls=x=>x==="x"?"hit":x==="n"?"near":"";
  const head=`<tr><th></th>${res?"<th>בפועל</th>":""}${list.map(p=>`<th>${esc(p.name)}</th>`).join("")}</tr>`;
  const sec=t=>`<tr class="secrow"><th colspan="${cols}">${t}</th></tr>`;
  const prow=c.parties.map(k=>`<tr><td>${pname(k)}</td>${res?`<td>${esc(res[k]??"–")}</td>`:""}${list.map((p,i)=>`<td class="${cls(sc[i].per[k])}">${esc(p.seats?.[k]??0)}</td>`).join("")}</tr>`).join("");
  const brow=BLOCS.map(k=>`<tr><td>${esc(k)}</td>${res?`<td>${esc(res.blocs?.[k]??"–")}</td>`:""}${list.map((p,i)=>`<td class="${cls(sc[i].bl[k])}">${esc(p.blocs?.[k]??0)}</td>`).join("")}</tr>`).join("");
  const trow=`<tr><td>אחוז הצבעה</td>${res?`<td>${res.turnout!=null?esc(res.turnout)+"%":"–"}</td>`:""}${list.map((p,i)=>`<td class="${cls(sc[i].turn)}">${esc(p.turnout)}%${sc[i].closest?" ⭐":""}</td>`).join("")}</tr>`;
  $("#view").innerHTML=`<div class="card scroll"><table>${head}${sec("מפלגות")}${prow}${sec("גושים")}${brow}${sec("אחוז הצבעה")}${trow}</table></div>${res?'<p class="muted" style="margin:0">ירוק = מדויק (באחוז הצבעה: בטווח 1%) · כתום = הפרש של מנדט אחד · ⭐ = הכי קרוב לאחוז ההצבעה</p>':""}`;
}

function toLocalInput(iso){if(!iso)return"";const d=new Date(iso);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}

  const d=state.data;
  if(!d.me?.isAdmin){state.tab="predict";return vPredict()}

  const resRows=c.parties.map((p,i)=>`<div class="row"><span class="n">${pname(p)}</span><input type="number" min="0" max="120" id="r-p-${i}" data-r="${esc(p)}" value="${esc(r[p]??"")}"></div>`).join("");
  const bRows=BLOCS.map((b,i)=>`<div class="row"><span class="n">${esc(b)}</span><input type="number" min="0" max="120" id="r-b-${i}" data-rb="${esc(b)}" value="${esc(r.blocs?.[b]??"")}"></div>`).join("");

    <label for="a-n">מנדטים: נקודות על הפרש של 1</label>${num("a-n",c.near)}
    <label for="a-bx">גושים: נקודות על ניחוש מדויק</label>${num("a-bx",c.blocExact)}
    <label for="a-bn">גושים: נקודות על הפרש של 1</label>${num("a-bn",c.blocNear)}
    <label for="a-tp">אחוז הצבעה: נקודות על טווח של 1%</label>${num("a-tp",c.turnPts)}
    <label for="a-tb">אחוז הצבעה: בונוס לניחוש הכי קרוב</label>${num("a-tb",c.turnBonus)}
    <label for="a-p">מפלגות (אחת בכל שורה)${hasEntries?" · אי אפשר לשנות אחרי שמישהו הגיש":""}</label>
    <textarea id="a-p" rows="9" ${L||hasEntries?"disabled":""}>${esc(c.parties.join("\n"))}</textarea>
    ${L?"":'<div class="actions"><button class="btn primary" id="a-save">שמור הגדרות</button><span id="a-msg" class="muted" role="status"></span></div>'}
  </div>
  <div class="card">
    <div class="sec">נעילת ההימורים</div>
    ${L?`<p style="margin:6px 0">ההימורים ננעלו ב-${esc(fmtTime(d.lockedAt))}. ${(d.picks||[]).length} ניחושים נספרים. הנעילה סופית.</p>`
    :`<p class="muted" style="margin:6px 0">אחרי הנעילה השרת לא מקבל יותר ניחושים או שינויים, והניחושים של כולם נחשפים. אי אפשר לבטל נעילה.</p>
      ${state.confirmLock?`<div class="confirm"><b>לנעול עכשיו?</b> ${d.totalEntrants??d.entrants.length} ניחושים יינעלו. מי שלא הגיש עד עכשיו לא יוכל להשתתף.<div class="actions"><button class="btn danger" id="lock-yes">כן, נעל</button><button class="btn" id="lock-no">ביטול</button></div></div>`
      :`<div class="actions"><button class="btn" id="lock">🔒 נעל עכשיו</button></div>`}`}
  </div>
  ${L?`<div class="card">
    <div class="sec">תוצאות רשמיות</div><p class="muted" style="margin:6px 0">שדה ריק לא נספר.</p>

  </div>`:""}`;
  const run=async(body,msgEl)=>{try{await api("/api/admin",body);if(msgEl)msgEl.textContent="נשמר ✓";await load()}catch(e){if(msgEl)msgEl.textContent=e.message;else alertBox(e.message)}};
  const alertBox=m=>{const b=document.createElement("div");b.className="banner bad";b.textContent=m;$("#view").prepend(b)};
  if(!L){
    $("#a-save").onclick=()=>{
      const dl=$("#a-deadline").value;

  }else{
    $("#r-save").onclick=()=>{

      document.querySelectorAll("input[data-r]").forEach(i=>{if(i.value!=="")o[i.dataset.r]=+i.value});
      document.querySelectorAll("input[data-rb]").forEach(i=>{if(i.value!=="")o.blocs[i.dataset.rb]=+i.value});
      if($("#r-tn").value!=="")o.turnout=+$("#r-tn").value;
      run({action:"results",results:o},$("#r-msg"));

    if(d.results)$("#r-clear").onclick=()=>run({action:"clearResults"},$("#r-msg"));

/* ---------- countdown to the exit polls ---------- */
// Polls close and the exit polls air on Tuesday 27.10.2026 at 22:00 Israel time
// (UTC+2: summer time ends on 25.10).
let EXIT_POLLS=Date.parse("2026-10-27T22:00:00+02:00"),PICKS_CLOSE=Date.parse("2026-10-27T08:00:00+02:00"),reloadedAtClose=false;
function tickCountdown(){
  const el=$("#countdown"),out=$("#cd-time"),label=el.querySelector(".cd-label");
  const now=Date.now();
  // Picks close: fetch the locked state once, so the form locks without a refresh.
  if(now>=PICKS_CLOSE&&!reloadedAtClose){reloadedAtClose=true;state.dirty=false;setTimeout(load,1500+Math.random()*15000)}
  // Before the lock the clock counts to the lock; after it, to the exit polls.
  const toLock=now<PICKS_CLOSE;
  label.textContent=toLock?"עד נעילת ההימורים":"עד המדגמים";
  el.title=toLock?"ההימורים ננעלים ביום שלישי 27.10 בשעה 08:00":"סגירת הקלפיות ושידור המדגמים, יום שלישי 27.10 בשעה 22:00";
  const ms=(toLock?PICKS_CLOSE:EXIT_POLLS)-now;
  if(ms<=0){
    const live=ms>-3*3600e3;
    el.classList.toggle("live",live);
    label.textContent=live?"עכשיו":"";
    out.textContent=live?"המדגמים משודרים":"המדגמים שודרו";
    return;
  }
  const s=Math.floor(ms/1000),dd=Math.floor(s/86400),p=n=>String(n).padStart(2,"0");
  const clock=`${p(Math.floor(s%86400/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`;
  out.innerHTML=(dd?`${dd}<small>${dd===1?"יום":"ימים"}</small>`:"")+`<span class="clk">${clock}</span>`;
}
tickCountdown();setInterval(tickCountdown,1000);

/* ---------- welcome screen (once per device), then the page settles in ---------- */
function arrive(){const m=$("main");m.classList.add("enter");setTimeout(()=>m.classList.remove("enter"),1200)}
function welcome(){
  // On an invite link the server names the group in og:title ("הוזמנת לקבוצת ...").
  const og=document.querySelector('meta[property="og:title"]')?.content||"";
  const invited=og.startsWith("הוזמנת")?og:"";
  const dots=Array.from({length:120},(_,i)=>`<i class="${i<61?"m":""}" style="--d:${(Math.floor(i/12)+i%12)*35}ms"></i>`).join("");
  const w=document.createElement("div");
  w.className="welcome";w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");w.setAttribute("aria-label","ברוכים הבאים");
  w.innerHTML=`<div class="w-in">
    <div class="w-rule"></div>
    <div class="w-kicker">${esc(invited||"בחירות לכנסת ה־26 · יום שלישי 27.10.2026")}</div>
    <h2 class="w-title"><span>הימורי</span> <span>בחירות</span> <span>2026</span></h2>
    <div class="w-seats" aria-hidden="true">${dots}</div>
    <p class="w-cap"><b>120</b> מנדטים · <b>61</b> לרוב</p>
    <p class="w-sub">נחשו כמה מנדטים כל מפלגה תקבל, השוו עם החברים, וגלו מי צדק כשהמדגמים עולים.</p>
    <button class="btn primary w-go" type="button">${invited?"להצטרפות":"בואו ננחש"}</button>
  </div>`;
  const main=$("main");
  main.inert=true;document.documentElement.style.overflow="hidden";document.body.appendChild(w);
  let done=false;
  const go=()=>{
    if(done)return;done=true;lsSet("wager_welcome","1");document.removeEventListener("keydown",key);
    main.inert=false;document.documentElement.style.overflow="";w.classList.add("out");arrive();setTimeout(()=>w.remove(),500);
  };
  const key=e=>{if(e.key==="Enter"||e.key==="Escape"){e.preventDefault();go()}};
  document.addEventListener("keydown",key);
  // A tap before the intro finishes jumps to its end; the button goes on to the page.
  w.addEventListener("click",e=>{if(e.target.closest(".w-go"))go();else w.classList.add("skip")});
}
if(lsGet("wager_welcome"))arrive();else welcome();

render();load();
</script>
